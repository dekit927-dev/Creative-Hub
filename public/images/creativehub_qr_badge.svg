<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" rx="36" fill="#F8FAFC" />
  <rect x="2" y="2" width="596" height="796" rx="34" fill="none" stroke="#DBEAFE" stroke-width="3" />

  <!-- Gradient Header -->
  <rect x="0" y="0" width="600" height="175" rx="36" fill="url(#headerGrad)" />
  <rect x="0" y="145" width="600" height="30" fill="url(#headerGrad)" />

  <!-- Header Texts -->
  <text x="300" y="52" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" letter-spacing="3">SHERUBTSE CREATIVE COMMUNITY</text>
  <text x="300" y="104" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="800" letter-spacing="-0.5">CreativeHub</text>
  <text x="300" y="138" text-anchor="middle" fill="#E0F2FE" font-size="15" font-weight="500">Together, We Build a Creative Community</text>

  <!-- QR Code White Card Container -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="200" width="400" height="400" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  </g>

  <!-- Rendered QR Code Inside -->
  <g transform="translate(138, 238) scale(0.835)">
    <path fill="#FFFFFF" d="M0 0h29v29H0z"/><path stroke="#1E3A8A" d="M0 0.5h7m1 0h1m3 0h1m3 0h1m3 0h1m1 0h7M0 1.5h1m5 0h1m2 0h3m4 0h2m1 0h2m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m3 0h8m2 0h1m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h3m4 0h1m1 0h1m1 0h2m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m2 0h9m1 0h2m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m2 0h2m2 0h2m3 0h1m1 0h1m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 7.5h2m2 0h2m4 0h1M2 8.5h1m1 0h3m1 0h1m3 0h2m1 0h1m4 0h2m3 0h1m2 0h1M2 9.5h1m1 0h1m2 0h1m5 0h1m1 0h2m2 0h3m1 0h1m2 0h1m1 0h1M0 10.5h1m1 0h3m1 0h1m1 0h1m2 0h1m2 0h4m1 0h3m1 0h1m3 0h2M0 11.5h2m1 0h3m1 0h1m2 0h5m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1M0 12.5h1m2 0h2m1 0h1m1 0h2m1 0h2m1 0h3m2 0h1m1 0h1M2 13.5h1m1 0h2m1 0h4m3 0h1m1 0h1m1 0h1m1 0h5M0 14.5h1m2 0h1m2 0h1m2 0h3m2 0h1m2 0h4m1 0h1m1 0h1m1 0h3M0 15.5h2m2 0h1m2 0h1m1 0h2m1 0h1m4 0h5m1 0h1m3 0h1M3 16.5h1m2 0h3m2 0h1m2 0h3m1 0h1m1 0h1m1 0h2m1 0h1m2 0h1M2 17.5h1m1 0h2m2 0h1m2 0h5m3 0h1m1 0h1m1 0h2m2 0h2M0 18.5h1m1 0h2m2 0h3m1 0h1m2 0h1m1 0h2m3 0h4m2 0h3M1 19.5h3m4 0h1m1 0h1m1 0h1m1 0h2m3 0h1m2 0h1m2 0h3M0 20.5h1m1 0h1m1 0h4m1 0h1m4 0h2m1 0h2m1 0h5m1 0h3M8 21.5h3m2 0h1m1 0h1m3 0h2m3 0h1m2 0h1M0 22.5h7m2 0h1m3 0h2m5 0h1m1 0h1m1 0h1m1 0h1M0 23.5h1m5 0h1m1 0h3m3 0h1m1 0h5m3 0h1m3 0h1M0 24.5h1m1 0h3m1 0h1m1 0h1m4 0h1m2 0h1m1 0h1m1 0h6m2 0h1M0 25.5h1m1 0h3m1 0h1m4 0h1m4 0h1m2 0h2m1 0h6M0 26.5h1m1 0h3m1 0h1m1 0h1m3 0h1m1 0h3m3 0h2m2 0h3m1 0h1M0 27.5h1m5 0h1m6 0h3m2 0h2m1 0h1m1 0h1m2 0h2M0 28.5h7m4 0h2m3 0h1m3 0h1m1 0h1m1 0h2m1 0h2"/>

  </g>

  <!-- Center Branded CreativeHub 'C' Pin -->
  <circle cx="300" cy="400" r="28" fill="#FFFFFF" filter="url(#cardShadow)" />
  <circle cx="300" cy="400" r="23" fill="#2563EB" />
  <text x="300" y="410" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="800">C</text>

  <!-- Action Pill Button -->
  <rect x="180" y="625" width="240" height="44" rx="22" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
  <text x="300" y="653" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700" letter-spacing="1">SCAN WITH PHONE</text>

  <!-- Value Proposition & URL -->
  <text x="300" y="705" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="700">Art • Photography • Writing • Music • Collaboration</text>
  <text x="300" y="734" text-anchor="middle" fill="#64748B" font-size="14">Open camera and point at QR code</text>
  <text x="300" y="762" text-anchor="middle" fill="#2563EB" font-size="13" font-weight="600">172.16.128.73:3000</text>
</svg>